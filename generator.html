<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URBANSIDE 26FW · 맞춤 가이드 링크 생성기</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<style>
  :root{
    --bg:#F4EFE4;
    --bg-card:#FBF8F1;
    --ink:#15130F;
    --ink-soft:rgba(21,19,15,0.66);
    --ink-faint:rgba(21,19,15,0.42);
    --orange:#E85D25;
    --hairline:rgba(21,19,15,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard Variable','Pretendard',-apple-system,'Noto Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:40px 20px;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
  }
  .eyebrow{
    font-size:11px;
    font-weight:700;
    color:var(--orange);
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin-bottom:8px;
  }
  h1{
    font-size:24px;
    font-weight:800;
    letter-spacing:-0.02em;
    margin:0 0 6px;
  }
  .sub{
    font-size:13px;
    color:var(--ink-faint);
    margin:0 0 28px;
  }
  .field{
    margin-bottom:16px;
  }
  .field label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  select{
    width:100%;
    font-family:inherit;
    font-size:14px;
    padding:11px 12px;
    border:1.5px solid var(--hairline);
    border-radius:8px;
    background:var(--bg-card);
    color:var(--ink);
    appearance:none;
    -webkit-appearance:none;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="%2315130F"><path d="M5.5 7.5l4.5 4.5 4.5-4.5" stroke="%2315130F" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>');
    background-repeat:no-repeat;
    background-position:right 12px center;
    padding-right:34px;
  }
  select:focus{
    outline:none;
    border-color:var(--orange);
  }

  .result-card{
    margin-top:8px;
    border:1.5px solid var(--hairline);
    border-radius:12px;
    background:var(--bg-card);
    padding:18px 20px;
  }
  .result-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .result-head .rh-label{
    font-size:13px;
    font-weight:800;
  }
  .copy-btn{
    background:var(--ink);
    color:var(--bg);
    border:none;
    font-family:inherit;
    font-size:12.5px;
    font-weight:700;
    padding:7px 14px;
    border-radius:7px;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .copy-btn:hover{ background:var(--orange); }
  .copy-btn.copied{ background:var(--orange); }

  .url-box{
    font-family:'SFMono-Regular',Consolas,monospace;
    font-size:12.5px;
    color:#2b6cb0;
    word-break:break-all;
    line-height:1.6;
    padding:10px 12px;
    background:var(--bg);
    border-radius:8px;
    border:1px solid var(--hairline);
  }
  .selected-summary{
    margin-top:14px;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .selected-summary b{
    color:var(--ink);
    font-weight:700;
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="eyebrow">26FW · Internal Tool</div>
    <h1>맞춤 가이드 링크 생성기</h1>
    <p class="sub">크리에이터별 채널·포맷·포트폴리오에 맞는 링크를 만들어 전달하세요.</p>

    <div class="field">
      <label>채널</label>
      <select id="selChannel">
        <option value="instagram">인스타그램</option>
        <option value="youtube">유튜브</option>
        <option value="tiktok">틱톡</option>
        <option value="blog">블로그</option>
      </select>
    </div>

    <div class="field">
      <label>콘텐츠 형태</label>
      <select id="selFormat">
        <option value="short">숏폼(릴스/쇼츠)</option>
        <option value="feed">피드형</option>
        <option value="long">롱폼</option>
      </select>
    </div>

    <div class="field">
      <label>포트폴리오 종류</label>
      <select id="selPortfolio">
        <option value="launch">런칭 소식 소구</option>
        <option value="review">제품 상세 리뷰 · USP</option>
        <option value="outdoor">야외 리뷰</option>
        <option value="free">크리에이터 자율</option>
        <option value="office">사무실 방문형</option>
      </select>
    </div>

    <div class="result-card">
      <div class="result-head">
        <span class="rh-label">맞춤 가이드 링크</span>
        <button class="copy-btn" id="copyBtn" onclick="copyLink()">링크 복사</button>
      </div>
      <div class="url-box" id="urlBox"></div>
      <div class="selected-summary" id="summaryBox"></div>
    </div>
  </div>

  <script>
    // ⚠ 페이지 주소가 바뀌면 여기만 수정하면 됩니다.
    var BASE_URL = 'https://urbansidekr.github.io/urbanside-26fw-guide/';

    var channelLabels = {instagram:'인스타그램', youtube:'유튜브', tiktok:'틱톡', blog:'블로그'};
    var formatLabels = {short:'숏폼(릴스/쇼츠)', feed:'피드형', long:'롱폼'};
    var portfolioLabels = {launch:'런칭 소식 소구', review:'제품 상세 리뷰 · USP', outdoor:'야외 리뷰', free:'크리에이터 자율', office:'사무실 방문형'};

    function buildAndRender(){
      var channel = document.getElementById('selChannel').value;
      var format = document.getElementById('selFormat').value;
      var portfolio = document.getElementById('selPortfolio').value;

      var url = BASE_URL + '?channel=' + channel + '&format=' + format + '&portfolio=' + portfolio + '#content-guide';

      document.getElementById('urlBox').textContent = url;
      document.getElementById('summaryBox').innerHTML =
        '선택한 모듈: <b>' + channelLabels[channel] + '</b> · <b>' + formatLabels[format] + '</b> · <b>' + portfolioLabels[portfolio] + '</b>';
    }

    function copyLink(){
      var text = document.getElementById('urlBox').textContent;
      var btn = document.getElementById('copyBtn');
      function flash(){
        var original = btn.textContent;
        btn.textContent = '복사됨 ✓';
        btn.classList.add('copied');
        setTimeout(function(){
          btn.textContent = original;
          btn.classList.remove('copied');
        }, 1400);
      }
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(flash);
      } else {
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        flash();
      }
    }

    ['selChannel','selFormat','selPortfolio'].forEach(function(id){
      document.getElementById(id).addEventListener('change', buildAndRender);
    });
    buildAndRender();
  </script>

</body>
</html>
